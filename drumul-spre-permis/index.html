<style>
/* Layout: o singură coloană 9:16 centrată, peisaj sub ea; lumea jocului e mereu „zi însorită”, deci un singur aspect, culori explicite. */
:root{
  --ink:#1d2a48; --ink-soft:#4a5878; --paper:#ffffff; --paper-2:#f3f8ff;
  --grass:#62c54a; --grass-d:#3a9a35; --grass-l:#9be36b;
  --sky:#8fdcff; --road:#3b404d;
  --red:#ec3f37; --red-d:#b8261f; --blue:#2e86ea; --blue-d:#1a5fb8; --blue-l:#6fc0ff;
  --yellow:#ffc928; --yellow-d:#e09a00; --orange:#ff8a1e; --green:#33c46b; --green-d:#1f9349;
  --gold:#ffcf3a; --gray:#9aa3b5; --gray-d:#6b7487;
  --font-d:"Baloo 2","Nunito","Trebuchet MS",system-ui,sans-serif;
  --font-b:"Nunito","Segoe UI",system-ui,sans-serif;
  --r-lg:26px; --r-md:18px; --r-sm:12px;
  --shadow-c:0 10px 24px rgba(30,70,140,.22);
  color-scheme:light;
}
html,body{height:100%;}
[hidden]{display:none!important}
body{margin:0;background:#7cc95a;color:var(--ink);font-family:var(--font-b);font-weight:700;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;}
#backdrop{position:fixed;inset:0;z-index:0;overflow:hidden;background:linear-gradient(#a6e3ff 0%,#c9f0ff 30%,#8fd56a 30.5%,#5fb84a 100%);}
#backdrop svg{position:absolute;inset:-40px;width:calc(100% + 80px);height:calc(100% + 80px);filter:blur(7px) saturate(1.1);opacity:.95}
#backdrop::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(255,255,255,0) 40%,rgba(20,60,30,.25) 100%);}
#shell{position:relative;z-index:1;height:100%;width:min(100vw,460px,calc(100dvh * 9 / 16));min-width:min(100vw,340px);margin:0 auto;overflow:hidden;background:#7fcf5e;box-shadow:0 0 0 1px rgba(255,255,255,.25),0 30px 80px rgba(10,40,20,.45);}
@media (max-width:520px){#shell{width:100vw;min-width:0;box-shadow:none}}
@media (min-width:521px){#shell{border-radius:0}}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0;}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid #fff;outline-offset:3px;box-shadow:0 0 0 6px var(--blue)}
svg{display:block}
.disp{font-family:var(--font-d);font-weight:800;letter-spacing:.2px}

/* ---------- Butoane groase ---------- */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:0 24px;border-radius:20px;font-family:var(--font-d);font-weight:800;font-size:20px;color:#fff;letter-spacing:.3px;text-shadow:0 2px 0 rgba(0,0,0,.18);transition:transform .12s ease, box-shadow .12s ease, filter .2s;--c1:#57b7ff;--c2:#1f74e0;--c3:#1356ad;background:linear-gradient(180deg,var(--c1),var(--c2));box-shadow:0 6px 0 var(--c3),0 12px 20px rgba(20,60,130,.3), inset 0 2px 0 rgba(255,255,255,.55);}
.btn::before{content:"";position:absolute;left:10px;right:10px;top:5px;height:42%;border-radius:14px 14px 30px 30px;background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,0));pointer-events:none}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--c3),0 4px 8px rgba(20,60,130,.25), inset 0 2px 0 rgba(255,255,255,.45)}
.btn[disabled]{filter:grayscale(1) opacity(.6);pointer-events:none}
.btn.yellow{--c1:#ffe066;--c2:#ffb400;--c3:#c77f00;color:#5a3700;text-shadow:0 1px 0 rgba(255,255,255,.5)}
.btn.green{--c1:#6be38f;--c2:#22b25a;--c3:#13803c}
.btn.red{--c1:#ff7b6e;--c2:#e63a30;--c3:#a91f18}
.btn.white{--c1:#ffffff;--c2:#e6eefb;--c3:#b8c6de;color:var(--ink);text-shadow:none}
.btn.dark{--c1:#4b5468;--c2:#2a3040;--c3:#141823}
.btn.wide{width:100%}
.btn.sm{min-height:42px;font-size:16px;padding:0 16px;border-radius:15px}
.btn.big{min-height:64px;font-size:28px;border-radius:24px}

/* ---------- Ecrane ---------- */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden;z-index:1}
.screen:not(.tab){z-index:40}
.screen[hidden]{display:none!important}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.scroll::-webkit-scrollbar{width:0}
.page{padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 120px;display:flex;flex-direction:column;gap:16px}
.bg-sky{background:linear-gradient(180deg,#9fe0ff 0%,#d8f4ff 42%,#e9f9e4 100%)}
.panel{background:var(--paper);border-radius:var(--r-lg);box-shadow:var(--shadow-c), inset 0 -4px 0 rgba(40,80,160,.08);padding:16px}
.h1{font-family:var(--font-d);font-weight:800;font-size:30px;line-height:1.05;margin:0;color:var(--ink);text-wrap:balance}
.h2{font-family:var(--font-d);font-weight:800;font-size:21px;margin:0;color:var(--ink)}
.muted{color:var(--ink-soft);font-weight:700}
.small{font-size:13px}
.row{display:flex;gap:10px;align-items:center}
.spacer{flex:1}

/* ---------- HUD ---------- */
.hud{position:absolute;left:10px;right:10px;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:20;display:flex;gap:6px;align-items:center;padding:7px 8px;border-radius:22px;background:linear-gradient(180deg,rgba(255,255,255,.62),rgba(255,255,255,.38));backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 6px 18px rgba(20,60,40,.22), inset 0 1px 0 rgba(255,255,255,.9)}
.chip{display:flex;align-items:center;gap:5px;padding:3px 10px 3px 4px;border-radius:16px;background:rgba(40,60,90,.16);font-family:var(--font-d);font-weight:800;font-size:17px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.35);white-space:nowrap;font-variant-numeric:tabular-nums;min-width:0}
.chip svg{width:30px;height:30px;flex:none;filter:drop-shadow(0 2px 2px rgba(0,0,0,.2))}
.chip.km{flex:1;justify-content:flex-start}
.rov{position:relative;width:44px;height:36px;flex:none}
.rov .n{position:absolute;right:-4px;bottom:-4px;background:var(--red);color:#fff;font-size:11px;border-radius:9px;padding:0 5px;font-family:var(--font-d);border:2px solid #fff}

/* ---------- Bara de navigare ---------- */
.nav{position:absolute;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(4,1fr);padding:6px 6px calc(env(safe-area-inset-bottom,0px) + 6px);background:linear-gradient(180deg,#3d8ff0,#1f62c9);box-shadow:0 -6px 20px rgba(10,40,100,.3), inset 0 2px 0 rgba(255,255,255,.35);border-radius:22px 22px 0 0}
.nav button{display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0 4px;border-radius:16px;font-family:var(--font-d);font-weight:800;font-size:15px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .15s}
.nav button svg{width:38px;height:38px;filter:drop-shadow(0 3px 2px rgba(0,0,0,.25));transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.nav button.on{background:linear-gradient(180deg,#ffe066,#ffae00);color:#5a3700;text-shadow:0 1px 0 rgba(255,255,255,.5);box-shadow:0 4px 0 #c77f00, inset 0 2px 0 rgba(255,255,255,.6);transform:translateY(-6px)}
.nav button.on svg{transform:scale(1.12) translateY(-2px)}
.nav .dot{position:absolute}

/* ---------- Harta ---------- */
#mapScroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
#mapScroll::-webkit-scrollbar{display:none}
#mapSvg{width:100%;height:auto}
.node{cursor:pointer}
.node .plaque{transition:transform .25s cubic-bezier(.3,1.6,.5,1);pointer-events:all}
.node:hover .plaque{transform:translateY(-3px)}
.node.cur .glow{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.35;transform:scale(1)}50%{opacity:.85;transform:scale(1.12)}}
.node.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.sidebtns{position:absolute;left:10px;top:calc(env(safe-area-inset-top,0px) + 76px);z-index:15;display:flex;flex-direction:column;gap:10px}
.roundbtn{position:relative;width:58px;height:58px;border-radius:20px;display:grid;place-items:center;background:linear-gradient(180deg,#fff,#e3ecfa);box-shadow:0 5px 0 #aebcd6,0 10px 16px rgba(20,50,100,.25), inset 0 2px 0 #fff;transition:transform .12s}
.roundbtn:active{transform:translateY(4px);box-shadow:0 1px 0 #aebcd6}
.roundbtn svg{width:40px;height:40px}
.roundbtn .lbl{position:absolute;bottom:-15px;left:50%;transform:translateX(-50%);font-family:var(--font-d);font-size:11px;color:#fff;white-space:nowrap;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.badge-n{position:absolute;top:-6px;right:-6px;min-width:22px;height:22px;border-radius:11px;background:var(--red);color:#fff;font-family:var(--font-d);font-size:13px;display:grid;place-items:center;padding:0 5px;border:2px solid #fff}
.mapfoot{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 92px);z-index:15;display:flex;align-items:flex-end;justify-content:space-between;padding:0 14px;pointer-events:none}
.mapfoot > *{pointer-events:auto}
.pab-wrap{position:relative;width:118px;height:118px;flex:none}
.pab-wrap .bubble{position:absolute;left:96px;bottom:70px;width:max-content;max-width:150px}
.bubble{background:#fff;border-radius:20px;padding:9px 13px;font-family:var(--font-d);font-weight:800;font-size:16px;line-height:1.15;color:var(--blue-d);box-shadow:0 6px 16px rgba(20,60,120,.25), inset 0 -3px 0 rgba(40,90,170,.08);position:relative;animation:bubIn .45s cubic-bezier(.3,1.6,.5,1)}
.bubble::after{content:"";position:absolute;left:-8px;bottom:12px;border:9px solid transparent;border-right-color:#fff;border-left:0}
.bubble.top::after{left:30px;bottom:-14px;border:9px solid transparent;border-top-color:#fff;border-bottom:0}
@keyframes bubIn{from{transform:scale(.4) translateY(10px);opacity:0}to{transform:none;opacity:1}}
.startbtn{min-width:170px}

/* ---------- Pablito animații ---------- */
.pab svg{width:100%;height:100%;overflow:visible}
.pab .tail{transform-origin:150px 150px;animation:wag 1.2s ease-in-out infinite}
.pab.happy .tail,.pab.proud .tail{animation-duration:.35s}
@keyframes wag{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(14deg)}}
.pab.jump{animation:jump .7s cubic-bezier(.3,1.5,.5,1)}
@keyframes jump{0%{transform:translateY(0) scale(1,1)}25%{transform:translateY(4px) scale(1.08,.9)}55%{transform:translateY(-34px) scale(.95,1.06)}80%{transform:translateY(0) scale(1.05,.95)}100%{transform:none}}
.pab .blink{animation:blink 4s infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.pab.idle svg{animation:breathe 3s ease-in-out infinite;transform-origin:50% 100%}
@keyframes breathe{50%{transform:scale(1.02,.985)}}

/* ---------- Overlay / foi ---------- */
#overlay{position:absolute;inset:0;z-index:60;pointer-events:none}
.sheet-bg{position:absolute;inset:0;background:rgba(15,30,60,.45);pointer-events:auto;animation:fadeIn .25s}
.sheet{position:absolute;left:0;right:0;bottom:0;pointer-events:auto;background:#fff;border-radius:28px 28px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom,0px) + 18px);box-shadow:0 -10px 30px rgba(10,30,70,.3);animation:sheetUp .38s cubic-bezier(.2,1.2,.4,1);max-height:88%;overflow-y:auto}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.toast{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);transform:translateX(-50%);pointer-events:none;background:#fff;color:var(--ink);font-family:var(--font-d);font-weight:800;padding:10px 18px;border-radius:18px;box-shadow:var(--shadow-c);animation:toast 2.4s ease forwards;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-20px)}12%{opacity:1;transform:translate(-50%,0)}85%{opacity:1}100%{opacity:0;transform:translate(-50%,-10px)}}
.say{display:flex;gap:10px;align-items:flex-end}
.say .pab{width:96px;height:96px;flex:none}
.say .bubble{flex:1;font-size:17px;color:var(--ink)}
.say .bubble b{color:var(--blue-d)}

/* ---------- Lecție ---------- */
.lesson{background:linear-gradient(180deg,#bfeaff 0%,#eef9ff 55%,#f7fff2 100%)}
.lesson.night{background:linear-gradient(180deg,#0f1a3c 0%,#223467 60%,#2c3f6e 100%);color:#eef3ff}
.lesson.fog{background:linear-gradient(180deg,#cfd8df 0%,#e8edf0 60%,#f2f4f5 100%)}
.lesson.night .h1,.lesson.night .h2{color:#fff}
.scen,.swipe-card,.flash .front,.inf,.lcard,.panel,.stat,.gauge,.item,.sg,.svc-item,.bdg,.pc{color:var(--ink)}
.lesson.night .lcard .h2,.lesson.night .panel .h2{color:var(--ink)}
.fogl{background:radial-gradient(ellipse at center,rgba(255,255,255,.95),rgba(255,255,255,0) 70%);height:160px}
.weather{position:absolute;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.stars i{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;animation:tw 2.4s infinite}
@keyframes tw{50%{opacity:.25}}
.fogl{position:absolute;left:-50%;width:200%;height:120px;background:radial-gradient(ellipse at center,rgba(255,255,255,.85),rgba(255,255,255,0) 70%);animation:fogm 14s linear infinite}
@keyframes fogm{from{transform:translateX(-15%)}to{transform:translateX(15%)}}
.ltop{position:relative;z-index:2;display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 8px}
.xbtn{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:rgba(255,255,255,.85);box-shadow:0 3px 0 rgba(30,60,120,.18)}
.xbtn svg{width:22px;height:22px}
.pbar{flex:1;height:18px;border-radius:10px;background:rgba(30,60,120,.15);overflow:hidden;box-shadow:inset 0 2px 3px rgba(0,0,0,.12)}
.pbar i{display:block;height:100%;width:0;border-radius:10px;background:linear-gradient(180deg,#8ff0a8,#27b65e);box-shadow:inset 0 3px 0 rgba(255,255,255,.45);transition:width .45s cubic-bezier(.3,1.3,.5,1)}
.lbody{position:relative;z-index:1;flex:1;overflow-y:auto;padding:6px 16px 20px;display:flex;flex-direction:column;gap:14px}
.lfoot{position:relative;z-index:2;padding:10px 16px calc(env(safe-area-inset-bottom,0px) + 16px)}
.eyebrow{font-family:var(--font-d);font-size:14px;letter-spacing:1.4px;text-transform:uppercase;color:var(--blue-d)}
.lesson.night .eyebrow{color:#9fd0ff}
.lcard{background:#fff;border-radius:var(--r-lg);padding:18px;box-shadow:var(--shadow-c);display:flex;flex-direction:column;gap:12px;animation:cardIn .5s cubic-bezier(.2,1.2,.4,1);color:var(--ink)}
@keyframes cardIn{from{opacity:0;transform:translateY(24px) scale(.96)}to{opacity:1;transform:none}}
.lcard p{margin:0;font-size:17px;line-height:1.45;font-weight:700}
.lcard .art{display:flex;justify-content:center;gap:14px;flex-wrap:wrap}
.lcard .art > svg{width:96px;height:96px;filter:drop-shadow(0 6px 6px rgba(0,0,0,.15))}
.lcard .art.wide > svg{width:100%;height:auto;max-height:190px}
.src{display:inline-flex;align-self:flex-start;gap:6px;align-items:center;font-size:13px;font-weight:800;color:#1a5fb8;background:#e6f1ff;border-radius:10px;padding:4px 10px}
.tip{background:linear-gradient(180deg,#fff7d6,#ffeaa5);border-radius:16px;padding:10px 12px;font-size:15px;line-height:1.35;color:#6a4300;box-shadow:inset 0 -3px 0 rgba(200,140,0,.18)}
.tip b{color:#a85d00}
.keyfacts{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.kf{background:var(--paper-2);border-radius:14px;padding:8px 10px;text-align:center}
.kf b{display:block;font-family:var(--font-d);font-size:26px;color:var(--blue-d);line-height:1}
.kf span{font-size:12.5px;color:var(--ink-soft)}

/* ---------- Învață ---------- */
.phases{position:relative;z-index:2;display:flex;gap:6px;padding:0 16px 6px}
.phases span{flex:1;text-align:center;font-family:var(--font-d);font-size:13.5px;padding:5px 4px;border-radius:12px;background:rgba(255,255,255,.55);color:var(--ink-soft)}
.phases span.on{background:linear-gradient(180deg,#ffe066,#ffb400);color:#5a3700;box-shadow:0 3px 0 #c77f00}
.phases span.done{background:#d6f5df;color:#167a3a}
.lesson.night .phases span:not(.on):not(.done){background:rgba(255,255,255,.15);color:#cfd8f0}
.explore{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.exp{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 8px;border-radius:18px;background:var(--paper-2);box-shadow:0 3px 0 #c9d6ea;text-align:center;color:var(--ink);transition:transform .15s, background .2s}
.exp:active{transform:translateY(2px)}
.exp .exs > svg{width:70px;height:70px;filter:drop-shadow(0 4px 4px rgba(0,0,0,.15))}
.exp .exs > svg[viewBox="0 0 200 100"]{width:120px;height:60px}
.exp .exi{display:flex;flex-direction:column;gap:2px;font-size:12.5px;line-height:1.25;font-weight:700;color:var(--ink-soft)}
.exp .exi b{font-family:var(--font-d);font-size:15px;color:var(--blue-d)}
.exp:not(.open){animation:wiggle 2.4s ease-in-out infinite}
.exp:not(.open):nth-child(2){animation-delay:.3s}.exp:not(.open):nth-child(3){animation-delay:.6s}.exp:not(.open):nth-child(4){animation-delay:.9s}
@keyframes wiggle{0%,88%,100%{transform:none}92%{transform:rotate(-2deg)}96%{transform:rotate(2deg)}}
.exp.open{background:#fff;box-shadow:0 3px 0 #6fd395, inset 0 0 0 2px #6fd395;animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
.exp.open .exi{color:var(--ink)}
@keyframes pop{50%{transform:scale(1.05)}}
.blist,.recap{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:7px;font-size:16px;line-height:1.4;font-weight:700}
.blist li::marker,.recap li::marker{color:var(--blue)}
.recap{font-size:16.5px}
.steps{margin:0;padding:0;list-style:none;counter-reset:st;display:flex;flex-direction:column;gap:8px}
.steps li{counter-increment:st;display:flex;gap:10px;align-items:flex-start;font-size:15.5px;line-height:1.35;font-weight:700}
.steps li::before{content:counter(st);flex:none;width:26px;height:26px;border-radius:9px;background:var(--blue);color:#fff;display:grid;place-items:center;font-family:var(--font-d);font-size:15px}
.lfoot .row .btn:not(.wide){flex:none;width:58px;padding:0}
.lfoot .row .btn svg{width:22px;height:22px}
.lfoot .row .btn.white svg path{stroke:#4a5878}

/* ---------- Quiz ---------- */
.qtext{font-family:var(--font-d);font-weight:700;font-size:21px;line-height:1.22;margin:0;text-wrap:balance}
.lesson.night .qtext{color:#fff}
.qsign{display:flex;justify-content:center}
.qsign > svg{width:120px;height:120px;filter:drop-shadow(0 8px 8px rgba(0,0,0,.18))}
.qsign.wide > svg{width:100%;height:auto;max-height:170px}
.qhint{font-size:13px;color:var(--ink-soft)}
.lesson.night .qhint{color:#b8c7e8}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;padding:12px 14px;min-height:60px;border-radius:18px;background:#fff;color:var(--ink);font-size:16.5px;font-weight:800;line-height:1.25;box-shadow:0 4px 0 #c9d6ea,0 6px 12px rgba(30,60,120,.1);border:2.5px solid transparent;transition:transform .1s, box-shadow .1s, border-color .15s, background .15s}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 #c9d6ea}
.opt .k{flex:none;width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-family:var(--font-d);font-size:18px;background:#eaf2ff;color:var(--blue-d)}
.opt.sel{border-color:var(--blue);background:#eef6ff;box-shadow:0 4px 0 #6aa9f0}
.opt.sel .k{background:var(--blue);color:#fff}
.opt.ok{border-color:var(--green);background:#e8fbef;box-shadow:0 4px 0 #6fd395}
.opt.ok .k{background:var(--green);color:#fff}
.opt.bad{border-color:var(--red);background:#ffeceb;box-shadow:0 4px 0 #f19c96}
.opt.bad .k{background:var(--red);color:#fff}
.opt.miss{border-style:dashed;border-color:var(--green)}
.fb{position:absolute;left:0;right:0;bottom:0;z-index:5;border-radius:26px 26px 0 0;padding:14px 16px calc(env(safe-area-inset-bottom,0px) + 16px);animation:sheetUp .35s cubic-bezier(.2,1.2,.4,1);display:flex;flex-direction:column;gap:10px;max-height:72%;overflow-y:auto}
.fb.good{background:linear-gradient(180deg,#dbffe6,#b9f5cc);color:#0f5c2c}
.fb.badf{background:linear-gradient(180deg,#ffe6e3,#ffd0cb);color:#7c1610}
.fb .ttl{font-family:var(--font-d);font-size:24px;font-weight:800}
.fb .ex{font-size:15.5px;line-height:1.4;color:var(--ink)}
.fb .say .pab{width:78px;height:78px}

/* ---------- Mini-jocuri ---------- */
.gtitle{display:flex;align-items:center;gap:10px}
.gtitle .ic{width:44px;height:44px;border-radius:14px;background:linear-gradient(180deg,#ffe066,#ffb400);display:grid;place-items:center;box-shadow:0 3px 0 #c77f00;font-family:var(--font-d);font-size:22px;color:#5a3700}
.score-dots{display:flex;gap:6px;justify-content:center}
.score-dots i{width:12px;height:12px;border-radius:50%;background:rgba(30,60,120,.18)}
.score-dots i.ok{background:var(--green)}
.score-dots i.bad{background:var(--red)}
.swipe-card{position:relative;align-self:center;width:min(300px,86%);min-height:250px;border-radius:26px;background:#fff;box-shadow:0 14px 30px rgba(20,50,110,.22);padding:18px;display:flex;flex-direction:column;align-items:center;gap:12px;touch-action:none;cursor:grab;transition:transform .3s}
.swipe-card .stmt{font-family:var(--font-d);font-size:19px;text-align:center;line-height:1.2}
.swipe-card > svg{width:110px;height:110px}
.swipe-hints{display:flex;justify-content:space-between;gap:10px}
.swipe-hints .btn{flex:1}
.stamp{position:absolute;top:18px;padding:4px 12px;border:4px solid;border-radius:12px;font-family:var(--font-d);font-size:24px;opacity:0;transform:rotate(-12deg)}
.stamp.l{left:14px;color:var(--red);border-color:var(--red)}
.stamp.r{right:14px;color:var(--green);border-color:var(--green);transform:rotate(12deg)}
.gauge-wrap{display:flex;justify-content:center;touch-action:none}
.gauge-wrap svg{width:min(320px,90%);height:auto;cursor:grab}
.scen{background:#fff;border-radius:18px;padding:12px 14px;box-shadow:var(--shadow-c);font-size:16.5px;line-height:1.35}
.scen .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tag{font-size:13px;padding:4px 10px;border-radius:10px;background:#eaf2ff;color:var(--blue-d);font-weight:800}
.tl-wrap{display:flex;gap:16px;align-items:center;justify-content:center}
.tl-wrap svg{width:110px;height:auto}
.timer{height:10px;border-radius:6px;background:rgba(30,60,120,.15);overflow:hidden}
.timer i{display:block;height:100%;background:linear-gradient(90deg,#ffd34d,#ff7b2e);width:100%}
.cazier-bar{height:30px;border-radius:15px;background:#e8eef8;overflow:hidden;position:relative;box-shadow:inset 0 2px 4px rgba(0,0,0,.12)}
.cazier-bar i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#ffd34d,#ff8a1e 60%,#e63a30);transition:width .5s cubic-bezier(.3,1.4,.5,1);border-radius:15px}
.cazier-bar span{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--font-d);font-size:16px;color:var(--ink)}
.inf-list{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.inf{padding:10px;border-radius:16px;background:#fff;box-shadow:0 3px 0 #c9d6ea;text-align:left;font-size:14px;line-height:1.2;display:flex;flex-direction:column;gap:4px;min-height:74px}
.inf b{font-family:var(--font-d);font-size:15px;color:var(--red-d)}
.inf.used{opacity:.45;pointer-events:none}
.flash{perspective:900px;align-self:center;width:min(310px,90%);height:230px}
.flash .in{position:relative;width:100%;height:100%;transition:transform .6s cubic-bezier(.3,1.3,.5,1);transform-style:preserve-3d;cursor:pointer}
.flash.flip .in{transform:rotateY(180deg)}
.flash .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:18px;text-align:center;box-shadow:0 14px 30px rgba(20,50,110,.22)}
.flash .front{background:linear-gradient(160deg,#fff,#eaf3ff);font-family:var(--font-d);font-size:20px;line-height:1.2}
.flash .back{background:linear-gradient(160deg,#2e86ea,#1a5fb8);color:#fff;transform:rotateY(180deg)}
.flash .back b{font-family:var(--font-d);font-size:46px;line-height:1}
.street > svg{width:100%;height:auto}
.zone{cursor:pointer}
.zone rect.hit{fill:rgba(255,255,255,0);stroke:rgba(255,255,255,0)}
.zone.on rect.hit{fill:rgba(51,196,107,.35);stroke:#22b25a;stroke-width:3}
.zone.ok-res rect.hit{stroke:#22b25a;stroke-width:4;fill:rgba(51,196,107,.25)}
.zone.bad-res rect.hit{stroke:#e63a30;stroke-width:4;fill:rgba(230,58,48,.28)}
.isec > svg{width:100%;height:auto;max-height:340px}
.carbtn{cursor:pointer}
.carbtn .ord{opacity:0}
.carbtn.picked .ord{opacity:1}
.officer svg{width:180px;height:auto;margin:0 auto}
.arm-anim-swing{animation:swing 1s ease-in-out infinite;transform-box:view-box}
@keyframes swing{0%,100%{transform:rotate(var(--a0))}50%{transform:rotate(var(--a1))}}

/* ---------- Recompensă ---------- */
.reward{align-items:center;text-align:center}
.burst{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.burst i{position:absolute;width:10px;height:14px;border-radius:3px;top:-20px;animation:conf 2.6s linear forwards}
@keyframes conf{to{transform:translateY(110vh) rotate(720deg)}}
.big-num{font-family:var(--font-d);font-size:44px;line-height:1;font-variant-numeric:tabular-nums}
.rw-row{display:flex;gap:12px;justify-content:center;width:100%}
.rw{flex:1;max-width:150px;background:#fff;border-radius:20px;padding:12px;box-shadow:var(--shadow-c);display:flex;flex-direction:column;align-items:center;gap:4px}
.rw svg{width:42px;height:42px}
.postcard{width:min(290px,88%);border-radius:14px;background:#fff;padding:8px;box-shadow:0 14px 30px rgba(20,50,110,.25);transform:rotate(-3deg);animation:pcIn .9s cubic-bezier(.2,1.3,.4,1)}
.postcard svg{width:100%;height:auto;border-radius:8px}
@keyframes pcIn{from{transform:rotate(-30deg) scale(.3) translateY(80px);opacity:0}to{transform:rotate(-3deg)}}

/* ---------- Garaj ---------- */
.garage-stage{position:relative;border-radius:28px;overflow:hidden;background:radial-gradient(ellipse at 50% 30%,#fff6dc 0%,#ffd98a 45%,#e9a64a 100%);box-shadow:var(--shadow-c);padding:18px 10px 8px;min-height:210px}
.garage-stage .floor{position:absolute;left:0;right:0;bottom:0;height:70px;background:linear-gradient(180deg,#c9874a,#9c5f2e);}
.garage-stage svg.car{position:relative;width:100%;height:auto;filter:drop-shadow(0 12px 8px rgba(60,30,0,.35))}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:8px 14px;border-radius:14px;background:#fff;font-family:var(--font-d);font-size:16px;box-shadow:0 3px 0 #c9d6ea;color:var(--ink-soft)}
.tab.on{background:var(--blue);color:#fff;box-shadow:0 3px 0 var(--blue-d)}
.shop{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.item{position:relative;background:#fff;border-radius:18px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 4px 0 #c9d6ea;font-size:13px;text-align:center;line-height:1.15;min-height:118px;border:2.5px solid transparent}
.item.eq{border-color:var(--green)}
.item .sw{width:48px;height:48px;border-radius:50%;box-shadow:inset 0 -6px 10px rgba(0,0,0,.25), inset 0 6px 8px rgba(255,255,255,.5)}
.item svg{width:52px;height:52px}
.price{display:inline-flex;align-items:center;gap:3px;font-family:var(--font-d);font-size:15px;color:#a86a00}
.price svg{width:18px;height:18px}
.m3card{position:relative;border-radius:24px;padding:14px;background:linear-gradient(160deg,#20263a,#0d111c);color:#fff;overflow:hidden;box-shadow:var(--shadow-c)}
.m3card .lock{position:absolute;right:14px;top:14px;width:40px;height:40px}
.m3card svg.car{width:100%;height:auto}

/* ---------- Trofee & profil ---------- */
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.bdg{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;font-size:12.5px;line-height:1.15;padding:8px 4px;border-radius:18px;background:#fff;box-shadow:0 3px 0 #c9d6ea}
.bdg svg{width:64px;height:64px}
.bdg.off{filter:grayscale(1);opacity:.55}
.album{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pc{border-radius:10px;background:#fff;padding:4px;box-shadow:0 3px 8px rgba(20,50,110,.18);font-size:11px;text-align:center;line-height:1.1;cursor:pointer}
.pc svg{width:100%;height:auto;border-radius:6px}
.pc.off{background:#dde5f0;box-shadow:none;color:var(--ink-soft)}
.pc.off svg{opacity:.18;filter:grayscale(1)}
.league li{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:14px;background:#fff;margin-bottom:6px;box-shadow:0 2px 0 #d6e0ef;font-variant-numeric:tabular-nums}
.league li.me{background:linear-gradient(180deg,#fff3c4,#ffe58a);box-shadow:0 3px 0 #e0b84a}
.league .pos{width:28px;font-family:var(--font-d);font-size:18px;color:var(--ink-soft)}
.league .av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--font-d)}
.league ul{list-style:none;margin:0;padding:0}
.gauges{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gauge{background:#fff;border-radius:18px;padding:8px 8px 10px;text-align:center;box-shadow:0 3px 0 #d6e0ef;font-size:12.5px;line-height:1.15}
.gauge svg{width:100%;height:auto}
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:#fff;border-radius:16px;padding:10px 6px;text-align:center;box-shadow:0 3px 0 #d6e0ef}
.stat b{display:block;font-family:var(--font-d);font-size:24px;color:var(--blue-d);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--ink-soft)}
.lvl{display:flex;gap:12px;align-items:center}
.lvl .medal{width:70px;height:70px;flex:none}
.xpbar{height:14px;border-radius:8px;background:#e6edf8;overflow:hidden}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,#ffd34d,#ff9d1e);border-radius:8px}
.setting{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1.5px solid #eef2f8}
.setting:last-child{border-bottom:0}
.switch{width:58px;height:34px;border-radius:17px;background:#cfd8e6;position:relative;transition:background .2s;flex:none}
.switch::after{content:"";position:absolute;left:3px;top:3px;width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.25);transition:transform .25s cubic-bezier(.3,1.5,.5,1)}
.switch.on{background:var(--green)}
.switch.on::after{transform:translateX(24px)}
input[type=range]{accent-color:var(--blue);width:140px}
.note{font-size:12.5px;color:var(--ink-soft);line-height:1.35;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.6)}

/* ---------- Pagini secundare (service, indicatoare) ---------- */
.subpage{background:linear-gradient(180deg,#9fe0ff 0%,#e3f6ff 40%,#f2fbef 100%);z-index:40}
.subhead{display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 6px}
.signs-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sg{background:#fff;border-radius:16px;padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:12.5px;line-height:1.15;box-shadow:0 3px 0 #d6e0ef}
.sg > svg{width:64px;height:64px}
.sg.wide{grid-column:span 3;flex-direction:row;text-align:left;gap:12px;padding:10px}
.sg.wide > svg{width:130px;height:auto;flex:none}
.svc-item{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:16px;background:#fff;box-shadow:0 3px 0 #d6e0ef;font-size:14px;line-height:1.3}
.svc-item .ct{flex:none;font-family:var(--font-d);color:#fff;background:var(--red);border-radius:10px;padding:2px 8px;font-size:13px}

/* ---------- Examen DRPCIV ---------- */
.exam{background:#eef2f7}
.exhead{background:linear-gradient(180deg,#1f3f7a,#14305f);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 10px;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.exhead div{background:rgba(255,255,255,.1);border-radius:10px;padding:4px 2px}
.exhead b{display:block;font-family:var(--font-d);font-size:22px;font-variant-numeric:tabular-nums;line-height:1.05}
.exhead span{font-size:10.5px;opacity:.85;text-transform:uppercase;letter-spacing:.6px}
.exbody{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.exfoot{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:8px;padding:10px 12px calc(env(safe-area-inset-bottom,0px) + 12px);background:#fff;box-shadow:0 -4px 14px rgba(0,0,0,.08)}
.exfoot .btn{font-size:14px;min-height:50px;padding:0 6px;line-height:1.05;text-align:center}
.verdict{font-family:var(--font-d);font-size:64px;line-height:1;letter-spacing:2px;padding:8px 24px;border:7px solid;border-radius:20px;transform:rotate(-8deg);animation:stampIn .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes stampIn{from{transform:rotate(-8deg) scale(3);opacity:0}to{transform:rotate(-8deg) scale(1);opacity:1}}
.verdict.ok{color:#159a48;border-color:#159a48}
.verdict.no{color:#d22b22;border-color:#d22b22}

/* ---------- Ceremonia cheilor ---------- */
.ceremony{background:radial-gradient(ellipse at 50% 35%,#2b3550 0%,#0b0e17 70%);color:#fff;align-items:center;justify-content:center;text-align:center;z-index:70}
.spot{position:absolute;left:50%;top:-10%;width:140%;height:90%;transform:translateX(-50%);background:radial-gradient(ellipse at 50% 100%,rgba(255,240,200,.35),rgba(255,240,200,0) 60%);animation:fadeIn 2s}
.ceremony svg.car{width:96%;height:auto;animation:driveIn 2.2s cubic-bezier(.15,.8,.25,1) both;filter:drop-shadow(0 20px 18px rgba(0,0,0,.7))}
@keyframes driveIn{from{transform:translateX(-120%)}to{transform:none}}
.keys{width:90px;height:90px;animation:keyDrop 1.2s 2.2s cubic-bezier(.3,1.6,.5,1) both}
@keyframes keyDrop{from{transform:translateY(-300px) rotate(-90deg);opacity:0}to{transform:none;opacity:1}}
.fadeup{animation:fadeUp .7s both}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}

/* ---------- Onboarding ---------- */
.onb{background:linear-gradient(180deg,#8fdcff 0%,#cbf1ff 45%,#86d763 45.2%,#5bb948 100%);align-items:center;text-align:center}
.onb .pab{width:200px;height:200px}
.onb .bubble.top{font-size:19px;max-width:300px;color:var(--ink)}
.dots{display:flex;gap:8px;justify-content:center}
.dots i{width:10px;height:10px;border-radius:5px;background:rgba(255,255,255,.6);transition:width .3s}
.dots i.on{width:28px;background:#fff}

@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* ---------- Pantalla de carga mientras baja el progreso de la nube ---------- */
#splash{position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  background:linear-gradient(180deg,#8fdcff 0%,#cbf1ff 45%,#86d763 45.2%,#5bb948 100%);font-family:var(--font-d)}
#splash .sp-pab{width:140px;height:140px}
#splash .sp-t{font-size:22px;font-weight:800;color:var(--ink)}
#splash .sp-s{font-size:14px;font-weight:700;color:var(--ink-soft);max-width:260px;text-align:center}
#splash .sp-bar{width:180px;height:10px;border-radius:6px;background:rgba(255,255,255,.55);overflow:hidden}
#splash .sp-bar i{display:block;height:100%;width:40%;border-radius:6px;background:var(--blue);animation:spmove 1.1s ease-in-out infinite}
@keyframes spmove{0%{transform:translateX(-110%)}100%{transform:translateX(260%)}}
</style>
</head>
<body>
<div id="splash">
  <div class="sp-pab" id="spPab"></div>
  <div class="sp-t">Se încarcă progresul…</div>
  <div class="sp-bar"><i></i></div>
  <div class="sp-s">Aducem kilometrii, leii și insignele din cloud, ca să continui de unde ai rămas.</div>
</div>
<div id="backdrop" aria-hidden="true"></div>
<div id="shell"><div id="screens"></div><nav class="nav" id="nav" aria-label="Navigare principală"></nav><div id="overlay"></div></div>
<script>

function trafficLight(state) {
  const on = c => state.includes(c);
  const lamp = (cy, col, dim, k) => `<circle cx="40" cy="${cy}" r="17" fill="${on(k)?col:dim}"/>${on(k)?`<circle cx="40" cy="${cy}" r="24" fill="${col}" opacity=".25"/><circle cx="34" cy="${cy-6}" r="5" fill="#fff" opacity=".6"/>`:''}`;
  const arrow = on('arrow') ? `<g><rect x="72" y="104" width="40" height="40" rx="8" fill="#1a1c22"/><path d="M80 124 L96 124 L96 116 L106 124 L96 132 L96 124" stroke="#33e07a" stroke-width="5" fill="#33e07a"><animate attributeName="opacity" values="1;.15;1" dur=".9s" repeatCount="indefinite"/></path></g>` : '';
  const blink = on('blink') ? `<animate attributeName="opacity" values="1;.2;1" dur="1s" repeatCount="indefinite"/>` : '';
  return `<svg viewBox="0 0 120 220"><rect x="36" y="150" width="8" height="70" fill="#6b7280"/><rect x="10" y="8" width="60" height="150" rx="16" fill="#23262e"/><rect x="14" y="12" width="52" height="142" rx="13" fill="#2d313b"/>
   ${lamp(40,'#ff3b30','#4a2020','r')}<g>${lamp(84,'#ffc21a','#4a3c14','y')}${blink}</g>${lamp(128,'#2be06a','#173a24','g')}${arrow}</svg>`;
}

/* ---------- Polițist rutier ---------- */
function officer(pose) {
  // unghiuri brațe: 0 = în jos, 90 = orizontal lateral, 180 = sus
  const P = { up:[0,180], horiz:[90,90], slow:[0,90], fast:[0,120], night:[0,90], rest:[0,0] };
  const [L, R] = P[pose] || P.rest;
  const anim = { slow:'-70;-112;-70', night:'-60;-125;-60' }[pose];
  const arm = (x, ang, side, a) => `<g transform="translate(${x} 92)"><g transform="rotate(${side*ang})">${a?`<animateTransform attributeName="transform" type="rotate" values="${a}" dur="1s" repeatCount="indefinite"/>`:''}${pose==='fast'&&side===-1?`<animateTransform attributeName="transform" type="rotate" values="0;-360" dur=".7s" repeatCount="indefinite"/>`:''}<rect x="-7" y="-4" width="14" height="52" rx="7" fill="#24407a"/><rect x="-7" y="18" width="14" height="6" fill="#d7ff3a"/><circle cx="0" cy="52" r="7" fill="#f2c39a"/>${pose==='night'&&side===-1?`<rect x="-3" y="56" width="6" height="24" rx="3" fill="#ff3b30"/><circle cx="0" cy="82" r="11" fill="#ff3b30" opacity=".35"/>`:''}</g></g>`;
  return `<svg viewBox="0 0 200 250"><ellipse cx="100" cy="240" rx="60" ry="8" fill="#000" opacity=".15"/>
    <rect x="80" y="160" width="18" height="74" rx="8" fill="#1d2f5a"/><rect x="102" y="160" width="18" height="74" rx="8" fill="#1d2f5a"/>
    <rect x="76" y="228" width="24" height="10" rx="5" fill="#111"/><rect x="100" y="228" width="24" height="10" rx="5" fill="#111"/>
    ${arm(70, L, 1)}
    <path d="M70 90 Q70 80 82 80 L118 80 Q130 80 130 90 L128 168 L72 168Z" fill="#2b4a8c"/>
    <path d="M74 92 L126 92 L124 160 L76 160Z" fill="#d7ff3a"/><rect x="74" y="118" width="52" height="7" fill="#c9ced8"/><rect x="74" y="140" width="52" height="7" fill="#c9ced8"/>
    <text x="100" y="112" text-anchor="middle" font-family="Arial" font-weight="700" font-size="12" fill="#1d2f5a">POLIȚIA</text>
    ${arm(130, R, -1, anim)}
    <rect x="92" y="66" width="16" height="16" fill="#f2c39a"/><circle cx="100" cy="52" r="22" fill="#f6cba4"/>
    <circle cx="92" cy="54" r="2.6" fill="#222"/><circle cx="108" cy="54" r="2.6" fill="#222"/><path d="M93 64 Q100 68 107 64" stroke="#a0522d" stroke-width="2" fill="none"/>
    <path d="M76 40 Q100 18 124 40 L124 44 L76 44Z" fill="#fff"/><rect x="74" y="40" width="52" height="8" rx="3" fill="#1d2f5a"/><path d="M78 48 Q100 54 122 48 L120 52 Q100 58 80 52Z" fill="#111"/><circle cx="100" cy="34" r="4" fill="#ffcf3a"/>
  </svg>`;
}

/* ---------- Fundal decorativ (desktop) ---------- */
function backdropSVG() {
  let s = `<svg viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice"><rect width="1600" height="1000" fill="#a6e3ff"/>
  <path d="M0 420 Q200 320 420 400 Q640 300 860 390 Q1100 300 1320 380 Q1480 330 1600 380 L1600 1000 L0 1000Z" fill="#8fd56a"/>
  <path d="M0 560 Q260 470 520 560 Q800 470 1080 560 Q1340 480 1600 540 L1600 1000 L0 1000Z" fill="#6cc24f"/>
  <path d="M-50 1000 C300 820 200 650 560 560 C900 480 1000 420 1250 380" stroke="#4a505e" stroke-width="70" fill="none"/>
  <path d="M-50 1000 C300 820 200 650 560 560 C900 480 1000 420 1250 380" stroke="#fff" stroke-width="5" stroke-dasharray="40 30" fill="none"/>
  <path d="M1600 300 C1400 420 1300 500 1500 700 C1600 800 1500 900 1400 1000" stroke="#55b8f0" stroke-width="40" fill="none"/>`;
  const rnd = mulberry(7);
  for (let i = 0; i < 40; i++) { const x = rnd()*1600, y = 450 + rnd()*520, r = 20 + rnd()*30; s += `<rect x="${x-4}" y="${y}" width="8" height="${r}" fill="#7a5130"/><circle cx="${x}" cy="${y}" r="${r}" fill="${rnd()>.5?'#4fb043':'#3e9a35'}"/>`; }
  return s + '</svg>';
}
function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

  {t:'STOP înseamnă oprire, mereu', p:['La indicatorul „Oprire” (STOP) oprești complet înaintea liniei continue de oprire, chiar dacă drumul pare liber. Abia apoi acorzi prioritate și pleci.','Pe asfalt, înaintea liniei, poate fi scris și „Stop”.'], signs:['stop','m_stop'], src:'Art. 81 alin. (1) din Regulament'},
  {t:'Cine are ultimul cuvânt?', p:'Când semnalele se contrazic, le respecți în această ordine. Primul din listă câștigă mereu:', steps:['Semnalele, indicațiile și dispozițiile polițistului rutier','Semnalele speciale ale vehiculelor cu regim prioritar (girofar + sirenă)','Semnalizarea temporară și indicatoarele electronice (de exemplu, la lucrări)','Semnalele luminoase sau sonore (semafoarele)','Indicatoarele','Marcajele','Regulile de circulație'], src:'Art. 31 din OUG 195/2002', tip:'Truc de examen: dacă semaforul arată verde, dar polițistul îți face semn să oprești, oprești. Polițistul e mereu pe primul loc.'},
  {t:'Culorile semaforului', p:['Verdele permite trecerea. Roșul interzice trecerea.','Galbenul aprins împreună cu roșul interzic și ele trecerea: ele doar anunță că urmează verdele. Așteaptă verdele!'], art:'lights3', src:'Art. 30 alin. (3) din OUG; Art. 52 alin. (3) din Regulament'}],
  recap:['Mijloacele de semnalizare: lumini/sunete, indicatoare, marcaje, alte dispozitive.','Triunghi cu vârful în jos = Cedează trecerea. Romb galben = Drum cu prioritate.','STOP = oprire completă înaintea liniei de oprire, chiar dacă nu vine nimeni.','Ordinea: polițist → vehicule prioritare → semnalizare temporară și indicatoare electronice → semafor → indicatoare → marcaje → reguli.','Roșu + galben împreună = încă interzis.'],
  game:{type:'swipe', items:[
    ['Polițistul rutier are prioritate față de semafor.', true, null, 'Art. 31 OUG'],
    ['La STOP pot trece fără oprire dacă nu vine nimeni.', false, 'stop', 'Art. 81 alin. (1) Reg.'],
    ['Rombul galben îmi spune că sunt pe drumul cu prioritate.', true, 'drum_prio', 'Art. 64 Reg.'],
    ['Roșul aprins împreună cu galbenul îmi permite să plec.', false, null, 'Art. 30 alin. (3) lit. c) OUG'],

L.TM = {cards:[
  {t:'Limbajul legii', p:'La examen, multe întrebări testează definiții exacte. Articolul 6 din OUG e dicționarul Codului rutier. Azi înveți cuvintele cele mai importante.', src:'Art. 6 din OUG 195/2002'},
  {t:'Drumul, bucată cu bucată', p:['Partea carosabilă e porțiunea pe care circulă vehiculele. Ea se împarte în benzi de circulație.','Acostamentul este fâșia laterală cuprinsă între limita părții carosabile și marginea platformei drumului.'], art:'roadsection', src:'Art. 6 pct. 2 și 7 din OUG 195/2002'},
  {t:'Banda de urgență', p:'Pe autostradă, la extremitatea din dreapta, există o bandă suplimentară. Ea servește exclusiv la staționarea în cazuri justificate și la circulația vehiculelor cu regim prioritar aflate în misiune. Nu e pentru depășiri!', art:'emergencylane', src:'Art. 6 pct. 8 din OUG 195/2002'},
  {t:'Vehicul sau autovehicul?', p:'Autovehiculul e orice vehicul cu motor de propulsie folosit pentru transportul de persoane sau mărfuri pe drum. Atenție la excepții:', facts:[['DA','Troleibuzul'],['DA','Mopedul'],['NU','Tramvaiul'],['NU','Tractorul agricol sau forestier']], src:'Art. 6 pct. 6 și 21 din OUG 195/2002', tip:'Truc de examen: tramvaiul NU e autovehicul (merge pe șine), dar troleibuzul și mopedul DA.'},
  {t:'Remorca ușoară și localitatea', p:['Remorca ușoară are masa totală maximă autorizată de cel mult 750 kg.','Localitate înseamnă cătunul, satul, comuna, orașul sau municipiul ale cărui intrări și ieșiri sunt semnalizate.'], facts:[['≤ 750 kg','remorcă ușoară']], src:'Art. 6 pct. 17 și 28 din OUG 195/2002'},
  {t:'Prioritate de trecere', p:'Prioritatea de trecere este dreptul unui participant la trafic de a trece înaintea celorlalți. Opusul ei, acordarea priorității, e obligația de a nu-ți continua drumul dacă i-ai obliga pe cei cu prioritate să frâneze sau să schimbe direcția.', src:'Art. 6 pct. 1 și 26 din OUG 195/2002'},
  {t:'Actele din buzunar', p:'Când conduci ai obligatoriu asupra ta:', list:['Actul de identitate','Permisul de conducere','Certificatul de înmatriculare al mașinii','Alte documente cerute de lege (ex. atestatul, pentru profesioniști)'], src:'Art. 147 pct. 1 din Regulament; Art. 35 alin. (2) din OUG', tip:'La cererea polițistului rutier ești obligat să i le înmânezi.'},

  {t:'Permisul de conducere', p:['Categoriile de permis sunt: AM, A1, A2, A, B1, B, BE, C1, C1E, C, CE, D1, D1E, D, DE, Tr, Tr1, Tb și Tv.','Permisul B are valabilitate administrativă de 10 ani. Cel pentru C sau D, de 5 ani.'], facts:[['16 ani','AM, A1, B1'],['18 ani','B, A2, BE, C1'],['21 de ani','C, D1'],['24 de ani','D, A']], src:'Art. 20 alin. (2) și (4), Art. 24 alin. (5) din OUG 195/2002'}],

L.CS = {cards:[
  {t:'Centura de siguranță', p:'Șoferul și toți pasagerii care stau pe locuri prevăzute cu centuri trebuie să le poarte pe toată durata mersului pe drumurile publice. Lipsa centurii aduce 2 puncte de penalizare.', facts:[['2 pct.','fără centură']], src:'Art. 36 alin. (1) și Art. 108 lit. a) pct. 3 din OUG'},
  {t:'Cine e scutit de centură', p:'Legea are doar câteva excepții:', list:['Șoferul de autoturism în timpul mersului înapoi sau când staționează','Femeile în stare vizibilă de graviditate','Taximetriștii, când transportă pasageri','Persoanele cu certificat medical (îl au asupra lor)','Instructorii auto și examinatorii, în timpul pregătirii sau al examenului'], src:'Art. 97 alin. (4) și (5) din Regulament', tip:'Truc de examen: „pasagerul din spate, pe distanțe scurte” NU e o excepție.'},
  {t:'Copiii în mașină', p:['Într-o mașină cu centuri, copilul de până la 135 cm stă obligatoriu într-un dispozitiv de fixare (scaun auto) omologat, montat de regulă pe locurile din spate. Peste 135 cm poartă centura de adult, reglată să nu treacă peste gât sau față, ori stă tot în scaun.','Pe locul din față, scaunul cu spatele la drum se montează doar cu airbagul frontal dezactivat.','Șoferul se asigură că minorii poartă centura sau stau în scaun. Altfel primește 3 puncte.'], facts:[['≤ 135 cm','scaun auto'],['> 135 cm','centură de adult'],['3 pct.','copil neasigurat']], src:'Art. 97 alin. (1)–(1.6) din Regulament; Art. 36 alin. (1.2) și Art. 108 lit. b) pct. 9 din OUG'},
  {t:'Mașini fără centuri', p:['Copiii până la 3 ani nu pot fi transportați în mașini fără sisteme de siguranță (excepții: transportul public și taxiul, pe alt loc decât în față, supravegheați de un adult).','Copiii peste 3 ani, cu înălțimea de până la 150 cm, pot călători în astfel de mașini doar dacă nu stau pe scaunele din față.'], facts:[['< 3 ani','nu fără centuri'],['≤ 150 cm','nu în față']], src:'Art. 36 alin. (1.3) din OUG; Art. 97 alin. (2)–(2.3) din Regulament'},
  {t:'Pablito nu stă în față', p:'Șoferului și pasagerului din față le este interzis să țină animale în brațe în timpul mersului, iar transportul animalelor pe locurile din față e contravenție. Eu călătoresc în cușca mea sau pe bancheta din spate, asigurat.', art:'dogcar', src:'Art. 97 alin. (3) din Regulament; Art. 102 alin. (1) pct. 27 din OUG'},
  {t:'Telefonul mobil', p:['În timpul mersului ai voie să vorbești la telefon doar cu un dispozitiv de tip „mâini libere”.','Telefonul ținut în mână e contravenție de clasa a III-a și aduce 4 puncte de penalizare. Dacă în același timp încalci și o altă regulă de circulație, permisul se suspendă 30 de zile.'], facts:[['4 pct.','telefon în mână'],['30 zile','telefon + altă abatere']], src:'Art. 36 alin. (3), Art. 101 alin. (1) pct. 19, Art. 108 lit. c) pct. 6 și Art. 100 alin. (3) lit. h) din OUG'},
  {t:'Semnul de începător', p:'Dacă ai permisul de mai puțin de un an, aplici semnul distinctiv de începător pe parbriz și pe lunetă.', src:'Art. 147 pct. 6 din Regulament'},
  {t:'Alte lucruri interzise la volan', list:['Să transporți mai multe persoane decât locurile din certificatul de înmatriculare','Să deschizi ușile în mers sau să pleci cu ușile deschise','Să ai preocupări care îți distrag atenția sau muzica prea tare','Să lași volanul liber sau să oprești motorul în mers','Să folosești claxonul în mod abuziv'], src:'Art. 148 din Regulament'}],
  recap:['Centura: obligatorie pentru toți; lipsa ei = 2 puncte.','Scutiți: mers înapoi/staționare, graviditate vizibilă, taxi cu pasageri, certificat medical, instructori.','Copii până la 135 cm: scaun auto omologat; peste 135 cm: centură de adult.','Mașină fără centuri: sub 3 ani interzis; peste 3 ani și până la 150 cm, nu în față.','Animalele nu stau în brațe și nu se transportă pe locurile din față.','Telefon doar cu „mâini libere” (altfel 4 puncte; cu încă o abatere, 30 zile suspendare).','Începător (sub un an): semn distinctiv pe parbriz și lunetă.'],
  game:{type:'numbers', ids:['k135','k150','k3','kphone','kbelt']}};

L.SB = {cards:[
  {t:'Ce este depășirea', p:'Depășirea e manevra prin care treci înaintea unui vehicul sau pe lângă un obstacol de pe același sens, schimbând direcția și ieșind de pe banda ta. Dacă doar mergi mai repede pe banda ta decât cei de pe banda vecină, nu e depășire.', src:'Art. 45 alin. (1) și (4) din OUG'},
  {t:'Pe ce parte', p:'Depășești numai prin stânga. Excepții: vehiculul care a semnalizat și s-a încadrat să vireze la stânga, precum și tramvaiul, se depășesc prin dreapta.', art:'overtake', src:'Art. 45 alin. (5) din OUG'},
  {t:'Pașii depășirii', steps:['Te asiguri că cel din față sau din spate nu a semnalizat deja o depășire și că nu încurci circulația din sens opus','Semnalizezi intenția','Păstrezi o distanță laterală suficientă față de cel depășit','Semnalizezi și te asiguri înainte să revii pe banda inițială'], src:'Art. 118 alin. (1) din Regulament'},
  {t:'Când ești tu cel depășit', p:'Nu mărești viteza și circuli cât mai aproape de marginea din dreapta a drumului sau a benzii.', src:'Art. 119 din Regulament'},
  {t:'Depășirea bicicletei și a trotinetei', p:['Ca să păstrezi distanța laterală de siguranță, când depășești o bicicletă sau o trotinetă electrică treci peste marcajul de separare:','cu peste 50 km/h: cu cel puțin jumătate din lățimea mașinii;','cu cel mult 50 km/h: cel puțin încălcând marcajul.'], facts:[['> 50 km/h','½ din lățimea mașinii'],['≤ 50 km/h','încalci marcajul']], src:'Art. 118 alin. (2) din Regulament'},
  {t:'Unde e interzis (1)', list:['În intersecțiile nedirijate','Pe vârfuri de rampă și în curbe cu vizibilitate sub 50 m','Pe poduri, pasaje, sub poduri și în tuneluri (excepție: biciclete, trotinete electrice, mopede, moto fără ataș, căruțe, dacă vezi peste 20 m și drumul are cel puțin 7 m)','Pe trecerile pentru pietoni','Pe calea ferată și cu mai puțin de 50 m înainte de ea'], src:'Art. 120 alin. (1) lit. a)–f) din Regulament'},
  {t:'Unde e interzis (2)', list:['Lângă tramvaiul oprit în stație fără refugiu','În zona indicatorului „Depășirea interzisă”','Când ai încălca linia continuă','Când cel din sens opus ar trebui să manevreze ca să te evite','Peste o coloană în așteptare, intrând pe contrasens','Coloana oficială nu se depășește niciodată'], signs:['depasire_interzisa'], src:'Art. 120 alin. (1) lit. g)–k) și alin. (2) din Regulament'}],
  recap:['Depășirea = ieși de pe banda ta ca să treci de cineva.','Se depășește prin stânga; tramvaiul și cel care virează la stânga, prin dreapta.','Semnalizezi la plecare și la revenire.','Cel depășit nu accelerează și ține dreapta.','Bicicleta și trotineta: peste 50 km/h treci peste marcaj cu cel puțin jumătate din mașină.','Interzis: intersecții nedirijate, curbe și rampe sub 50 m vizibilitate, poduri, tuneluri, treceri de pietoni, calea ferată (+50 m), linie continuă, coloană oficială.'],
  game:{type:'swipe', items:[
    ['Pot depăși pe o trecere pentru pietoni marcată.', false, 'pietoni', 'Art. 120 lit. e) Reg.'],
    ['În tunel pot depăși o bicicletă dacă văd peste 20 m și drumul are 7 m.', true, null, 'Art. 120 lit. d) Reg.'],
    ['Coloana oficială se poate depăși dacă e lentă.', false, null, 'Art. 120 alin. (2) Reg.'],
    ['Când sunt depășit, am voie să accelerez puțin.', false, null, 'Art. 119 Reg.'],
    ['Depășesc peste linia continuă dacă drumul e liber.', false, 'm_continuu', 'Art. 120 lit. i) Reg.']]}};

/* Progresul se salveaza prin ZongaLS: textul e comprimat (~7-10x) si, daca tot

function load() {

    const raw = window.ZongaLS ? ZongaLS.load(SAVE_KEY) : localStorage.getItem(SAVE_KEY);
    if (raw) S = Object.assign(DEF(), JSON.parse(raw));

  delete S.settings.explore;
}
let __saveAvertizat = false;
function save() {
  const json = JSON.stringify(S);
  const ok = window.ZongaLS
    ? ZongaLS.save(SAVE_KEY, json)
    : (() => { try { localStorage.setItem(SAVE_KEY, json); return true; } catch (e) { return false; } })();

    __saveAvertizat = true;
    console.error('[drum] progresul NU s-a salvat: memoria dispozitivului este plina');

  }
  return ok;
}

/* ---------- Sunet (Web Audio, fără fișiere) ---------- */
const SFX = (() => {
  let ctx, master, comp, gest = false;
  ['pointerdown','keydown','touchstart'].forEach(ev => document.addEventListener(ev, () => { gest = true; }, { capture: true, once: true }));
  const init = () => {
    if (!gest) return false;
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return true; }
    try {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      comp = ctx.createDynamicsCompressor(); master = ctx.createGain();
      master.gain.value = S.settings.vol; master.connect(comp); comp.connect(ctx.destination);
      return true;
    } catch (e) { return false; }
  };
  const ok = () => S.settings.sound && gest && init();
  const env = (g, t, a, d, peak) => { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + a + d); };
  const tone = (type, f0, f1, t, dur, peak = .3, dest = master) => {
    const o = ctx.createOscillator(), g = ctx.createGain(); o.type = type; o.frequency.setValueAtTime(f0, t);
    if (f1) o.frequency.exponentialRampToValueAtTime(f1, t + dur); env(g, t, .008, dur, peak); o.connect(g); g.connect(dest); o.start(t); o.stop(t + dur + .05); return o;
  };
  const noise = (t, dur, f0, f1, peak = .2, q = 1, type = 'bandpass') => {
    const len = ctx.sampleRate * dur, b = ctx.createBuffer(1, len, ctx.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain(); s.buffer = b; f.type = type; f.Q.value = q;
    f.frequency.setValueAtTime(f0, t); if (f1) f.frequency.exponentialRampToValueAtTime(f1, t + dur);
    env(g, t, .02, dur, peak); s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + dur + .05);
  };
  const fanfare = (t, notes, step = .12, type = 'triangle', peak = .18) => notes.forEach((n, i) => { const f = 440 * Math.pow(2, (n - 69) / 12); tone(type, f, null, t + i * step, .32, peak); tone('sine', f * 2, null, t + i * step, .25, peak * .35); });
  const engine = (t, dur, f0, f1, peak, dist) => {
    const o = ctx.createOscillator(), o2 = ctx.createOscillator(), ws = ctx.createWaveShaper(), lp = ctx.createBiquadFilter(), g = ctx.createGain();
    const curve = new Float32Array(256); for (let i = 0; i < 256; i++) { const x = i / 128 - 1; curve[i] = Math.tanh(x * dist); } ws.curve = curve;
    o.type = 'sawtooth'; o2.type = 'square'; o.frequency.setValueAtTime(f0, t); o2.frequency.setValueAtTime(f0 * .5, t);
    o.frequency.exponentialRampToValueAtTime(f1, t + dur * .7); o2.frequency.exponentialRampToValueAtTime(f1 * .5, t + dur * .7);
    o.frequency.exponentialRampToValueAtTime(f1 * .6, t + dur);
    lp.type = 'lowpass'; lp.frequency.setValueAtTime(500, t); lp.frequency.exponentialRampToValueAtTime(2200, t + dur * .7);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + .15); g.gain.setValueAtTime(peak, t + dur * .75); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(ws); o2.connect(ws); ws.connect(lp); lp.connect(g); g.connect(master); o.start(t); o2.start(t); o.stop(t + dur + .1); o2.stop(t + dur + .1);
  };
  const api = {
    init, setVol(v) { if (master) master.gain.value = v; },
    pop() { if (!ok()) return; const t = ctx.currentTime; tone('sine', 720, 260, t, .09, .25); },
    ding() { if (!ok()) return; const t = ctx.currentTime; tone('triangle', 880, null, t, .18, .22); tone('triangle', 1318, null, t + .09, .35, .22); tone('sine', 2637, null, t + .09, .25, .05); },
    honk() { if (!ok()) return; const t = ctx.currentTime; const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1400; lp.connect(master);
      [415, 523].forEach(f => { tone('square', f, f * .97, t, .22, .07, lp); tone('square', f, f * .97, t + .27, .16, .06, lp); }); },
    coin() { if (!ok()) return; const t = ctx.currentTime; [0, .07, .14].forEach((d, i) => { tone('square', 1568 + i * 200, null, t + d, .08, .05); tone('sine', 2093 + i * 260, null, t + d + .03, .12, .08); }); },
    tick() { if (!ok()) return; const t = ctx.currentTime; tone('square', 2200, 1800, t, .02, .03); },
    lesson() { if (!ok()) return; const t = ctx.currentTime; engine(t, 1.1, 70, 210, .16, 2.5); fanfare(t + 1.0, [72, 76, 79, 84], .11); },
    unlock() { if (!ok()) return; const t = ctx.currentTime; noise(t, .05, 3000, null, .3, 2); tone('square', 900, 400, t + .02, .05, .08); noise(t + .12, .5, 400, 3000, .14, .8); },
    bark() { if (!ok()) return; const t = ctx.currentTime; const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 900; bp.Q.value = 3; bp.connect(master);
      [0, .18].forEach(d => { const o = ctx.createOscillator(), g = ctx.createGain(); o.type = 'sawtooth'; o.frequency.setValueAtTime(520, t + d); o.frequency.exponentialRampToValueAtTime(880, t + d + .04); o.frequency.exponentialRampToValueAtTime(420, t + d + .11); env(g, t + d, .01, .1, .35); o.connect(g); g.connect(bp); o.start(t + d); o.stop(t + d + .15); }); },
    siren() { if (!ok()) return; const t = ctx.currentTime; const o = ctx.createOscillator(), g = ctx.createGain(); o.type = 'triangle';
      for (let i = 0; i < 4; i++) { o.frequency.setValueAtTime(i % 2 ? 960 : 640, t + i * .32); o.frequency.linearRampToValueAtTime(i % 2 ? 640 : 960, t + i * .32 + .3); }
      g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.12, t + .05); g.gain.setValueAtTime(.12, t + 1.15); g.gain.exponentialRampToValueAtTime(.0001, t + 1.3); o.connect(g); g.connect(master); o.start(t); o.stop(t + 1.35); },
    roar() { if (!ok()) return; const t = ctx.currentTime; engine(t, 2.4, 45, 260, .28, 6); noise(t, 2.2, 200, 900, .08, .6, 'lowpass'); fanfare(t + 1.9, [60, 64, 67, 72, 76, 79, 84], .14, 'sawtooth', .1); fanfare(t + 2.9, [72, 76, 79, 84], .0, 'triangle', .16); },
    fail() { if (!ok()) return; const t = ctx.currentTime; [392, 370, 349, 330].forEach((f, i) => tone('triangle', f, null, t + i * .22, .3, .16)); }
  };
  return api;
})();

/* ---------- Tastatură: 1–4 alege, Enter confirmă ---------- */
let KEYS = {};
document.addEventListener('keydown', e => {
  if (e.target.matches && e.target.matches('input')) return;
  if (/^[1-4]$/.test(e.key) && KEYS.choose) { e.preventDefault(); KEYS.choose(+e.key - 1); }
  else if (e.key === 'Enter' && KEYS.confirm) { e.preventDefault(); KEYS.confirm(); }
  else if (e.key === 'Escape' && KEYS.back) { e.preventDefault(); KEYS.back(); }
  else if ((e.key === 'ArrowLeft' || e.key === 'ArrowRight') && KEYS.arrow) { e.preventDefault(); KEYS.arrow(e.key === 'ArrowRight' ? 1 : -1); }
});

/* ---------- Progres ---------- */
const levelOf = km => { let i = 0; LEVELS.forEach((l, k) => { if (km >= l[0]) i = k; }); return i; };
const UNL = () => S.unlocked;
function curNodeIdx() { for (let i = 0; i <= S.unlocked && i < NODES.length; i++) if (!S.done[NODES[i].id]) return i; return Math.min(S.unlocked, NODES.length - 1); }
function effectiveStreak() {
  if (!S.lastDay) return 0;
  const gap = dayDiff(S.lastDay, dayKey());
  if (gap <= 1) return S.streak;
  if (gap - 1 <= S.rov) return S.streak;
  return 0;
}
function touchStreak() {
  const today = dayKey();
  if (S.lastDay === today) return false;
  if (!S.lastDay) S.streak = 1;
  else {
    const gap = dayDiff(S.lastDay, today);
    if (gap === 1) S.streak++;
    else if (gap - 1 <= S.rov) { S.rov -= gap - 1; S.streak++; toast(`Rovinieta ți-a salvat seria! (${gap - 1} ${gap - 1 === 1 ? 'zi' : 'zile'})`); }
    else S.streak = 1;
  }
  S.lastDay = today;
  if (S.streak >= 7) award('streak7');
  return true;
}
function addKm(n) { S.km += n; if (S.week.key !== weekKey()) S.week = { key: weekKey(), km: 0 }; S.week.km += n; }
function award(id) {
  if (S.badges[id]) return;
  S.badges[id] = dayKey(); save();

function gaugeSVG(pct) {

  let ticks = ''; for (let k = 0; k <= 10; k++) { const t = Math.PI * (1 - k / 10); ticks += `<path d="M${cx + 34 * Math.cos(t)} ${cy - 34 * Math.sin(t)} L${cx + (k % 5 ? 30 : 27) * Math.cos(t)} ${cy - (k % 5 ? 30 : 27) * Math.sin(t)}" stroke="#9aa6b8" stroke-width="1.6"/>`; }

function runLesson(node) {

/* ---------- Motorul de întrebări ---------- */
function quizFlow(sh, qs, mode, onEnd, onEach, label, node) {
  let i = 0; const out = [];

    sh.body.innerHTML = `<div class="eyebrow">${mode === 'control' ? 'Control de poliție' : mode === 'service' ? 'Service auto' : mode === 'daily' ? 'Ruta zilei' : 'Quiz'} · întrebarea ${i + 1} din ${qs.length}</div>
      ${q.sign ? `<div class="qsign ${SIGN[q.sign] && SIGN[q.sign].f in { longitudinale: 1, transversale: 1, diverse: 1, laterale: 1 } ? 'wide' : ''}">${signSVG(q.sign)}</div>` : qImg(q.img)}
      <p class="qtext">${esc(q.q)}</p><div class="qhint">Pot fi corecte una, două sau toate variantele. Taste: 1–3 și Enter.</div>${node ? `<button class="btn white sm" id="rr" style="align-self:flex-start">Recitește lecția</button>` : ''}
      <div class="opts">${q.opts.map((o, k) => `<button class="opt" data-k="${k}"><span class="k">${'ABC'[k]}</span><span>${esc(o)}</span></button>`).join('')}</div>`;
    sh.body.scrollTop = 0;
    sh.foot.innerHTML = `<button class="btn green wide" id="chk" disabled>Verifică</button>`;
    const chk = $('#chk', sh.foot); const rr = $('#rr', sh.body); if (rr) rr.onclick = () => openRecap(node);
    const toggle = k => { if (locked || k >= q.opts.length) return; SFX.pop(); sel.has(k) ? sel.delete(k) : sel.add(k); $$('.opt', sh.body).forEach((b, j) => b.classList.toggle('sel', sel.has(j))); chk.disabled = !sel.size; };
    $$('.opt', sh.body).forEach(b => b.onclick = () => toggle(+b.dataset.k));
    const verify = () => {
      if (!sel.size || locked) return; locked = true;
      const ok = sel.size === q.correct.length && q.correct.every(k => sel.has(k));
      $$('.opt', sh.body).forEach((b, k) => { const c = q.correct.includes(k); if (c) b.classList.add('ok'); if (sel.has(k) && !c) b.classList.add('bad'); if (c && !sel.has(k)) b.classList.add('miss'); b.classList.remove('sel'); });
      recordAnswer(q, ok, mode); out.push({ q, ok }); onEach && onEach();
      if (ok) { SFX.ding(); vib(25); } else { SFX.honk(); vib([60, 40, 60]); }
      const praise = ['Corect!', 'Bravo!', 'Exact!', 'Perfect!', 'Așa da!'], oops = ['Nu chiar…', 'Aproape!', 'Hai să vedem…'];
      const trick = Math.random() < .25 ? `<div class="tip">${esc(TRICKS[Math.floor(Math.random() * TRICKS.length)])}</div>` : '';
      const fb = html(`<div class="fb ${ok ? 'good' : 'badf'}"><div class="say">${pabEl(ok ? 'happy' : 'sad', ok ? 'jump' : '')}<div class="bubble"><span class="ttl">${ok ? praise[Math.floor(Math.random() * praise.length)] : oops[Math.floor(Math.random() * oops.length)]}</span><div class="ex" style="margin-top:4px">${esc(q.ex)}</div></div></div>
        <span class="src">${esc(q.src)}</span>${ok ? '' : '<span class="small" style="font-weight:800">Întrebarea a mers la Service auto. O repari mai târziu.</span>'}${trick}${!ok && node ? '<button class="btn white sm" id="rr2">Recitește lecția</button>' : ''}<button class="btn ${ok ? 'green' : 'red'} wide" id="cont">Continuă</button></div>`);
      sh.s.append(fb); chk.style.visibility = 'hidden'; const rr2 = $('#rr2', fb); if (rr2) rr2.onclick = () => openRecap(node);
      const cont = () => { SFX.pop(); fb.remove(); i++; i < qs.length ? show() : (sh.s.className = baseCls, onEnd(out)); };
      $('#cont', fb).onclick = cont; KEYS = { ...KEYS, confirm: cont, choose: null };
    };
    chk.onclick = verify; KEYS = { ...KEYS, choose: toggle, confirm: verify };
  };
  show();
}
function runQuiz({ title, questions, mode, onDone, weather, cls }) {

/* ---------- Recompensa ---------- */
function reward(node, sh, res) {
  const ok = res.quiz.filter(x => x.ok).length; const first = !S.done[node.id];
  const km = Math.round((first ? 40 : 15) + ok * (first ? 10 : 4) + res.game[0] * 2);
  const lei = Math.round((first ? 15 : 5) + ok * (first ? 5 : 2));
  const fromKm = S.km, fromLei = S.lei;
  addKm(km); S.lei += lei; touchStreak();
  if (ok === res.quiz.length) award('perfect');
  if (first) { S.done[node.id] = { ok, at: dayKey() }; S.postcards[node.id] = true; if (node.idx <= S.unlocked) S.unlocked = Math.max(S.unlocked, node.idx + 1); award('first'); if (Object.keys(S.postcards).length >= 15) award('coll'); }
  save();
  sh.setP(1); $('#lx', sh.s).style.visibility = 'hidden';
  sh.body.className = 'lbody reward';
  sh.body.innerHTML = `<div class="eyebrow">${esc(node.name)} · lecție terminată</div><h1 class="h1">${ok === res.quiz.length ? 'Fără nicio greșeală!' : ok >= res.quiz.length - 1 ? 'Drum bun înainte!' : 'Ai ajuns la destinație!'}</h1>
    <div class="rw-row"><div class="rw">${IC.road}<span class="big-num" id="rKm">0</span><span class="small muted">km</span></div><div class="rw">${IC.coin}<span class="big-num" id="rLei">0</span><span class="small muted">lei</span></div><div class="rw"><span class="big-num">${ok}/${res.quiz.length}</span><span class="small muted">corecte</span></div></div>
    ${first ? `<div class="postcard">${postcardSVG(node)}</div><span class="small muted">Vedere nouă în album: ${esc(node.pc)}</span>` : `<span class="small muted">Lecție repetată: recompense mai mici, dar întrebările greșite se repară mai ușor.</span>`}
    <div class="say" style="width:100%">${pabEl('proud', 'jump')}<div class="bubble">${ok === res.quiz.length ? 'Zero puncte de penalizare! Sunt mândru de tine!' : ok >= res.quiz.length - 1 ? 'Foarte bine! Ce ai greșit te așteaptă la Service auto.' : 'Nu-i nimic, repetiția e mama învățăturii. Trecem prin service mai târziu!'}</div></div>`;
  sh.foot.innerHTML = `<button class="btn yellow wide big" id="rgo">Mai departe</button>`;
  SFX.lesson(); confetti(sh.s, ok >= res.quiz.length - 1 ? 70 : 30);
  setTimeout(() => { countUp($('#rKm', sh.s), 0, km, 1000); }, 500);
  setTimeout(() => { SFX.coin(); countUp($('#rLei', sh.s), 0, lei, 600, false); }, 1500);
  const go = async () => {
    SFX.pop(); KEYS = {}; popScreen(sh.s); showTab('map');
    if (first && !S.settings.explore && S.unlocked === node.idx + 1 && S.unlocked < NODES.length) {
      await sleep(250); SFX.unlock(); await animateCarTo(node.idx, node.idx + 1); renderMap();
      const nx = NODES[node.idx + 1]; toast(nx.type === 'control' ? `Control de poliție în ${REG[nx.region].name}!` : `Deblocat: ${nx.name}`);
    }
  };
  $('#rgo', sh.foot).onclick = go; KEYS = { confirm: go };
}

      ${wrong.length ? `<div class="lcard" style="text-align:left;width:100%"><h2 class="h2">De recitit</h2>${wrong.map(q => `<div style="border-top:1.5px solid #eef2f8;padding-top:8px"><b>${esc(q.q)}</b><p style="font-size:14.5px;margin:4px 0">${esc(q.ex)}</p><span class="src">${esc(q.src)}</span></div>`).join('')}</div>` : ''}
    </div><div class="lfoot"><button class="btn ${admis ? 'yellow' : ''} wide big" id="fin">${firstPass ? 'Primește cheile' : 'Înapoi la hartă'}</button></div>`;
    if (admis) { SFX.lesson(); confetti(s, 90); } else SFX.fail();
    $('#fin', s).onclick = () => { SFX.pop(); popScreen(s); if (firstPass) ceremony(); else showTab('map'); };
    KEYS = { confirm: () => $('#fin', s).click() };
  };
  show();
}

  const s = pushScreen('ceremony'); award('admis'); S.m3 = true; save();

    ${carSVG('m')}<div class="keys">${IC.key}</div>

    <div class="say fadeup" style="width:100%;animation-delay:3.6s">${pabEl('proud', 'jump')}<div class="bubble">Permisul e în buzunar. Acum condu ca la carte!</div></div>
    <button class="btn yellow wide big fadeup" id="drive" style="animation-delay:4s">Ia-l la o tură</button></div>`;
  SFX.roar(); vib([60, 40, 60, 40, 200]);

  showTab('map');

/* ---------- Intai sincronizarea, apoi jocul ----------
   Daca am porni direct, pe un dispozitiv nou ai vedea o clipa progresul gol,
   ai apuca sa joci, iar apoi sync.js ar reincarca pagina cu datele din cloud.
   Asteptam reconcilierea initiala (evenimentul `zonga:sync`), cu doua iesiri
   de siguranta: daca nu esti autentificat pornim imediat, iar daca reteaua nu
   raspunde pornim oricum dupa cateva secunde. Progresul facut offline nu se
   pierde: ramane in coada de sincronizare a lui sync.js. */
function bootCuSincronizare() {
  const splash = document.getElementById('splash');
  const pab = document.getElementById('spPab');
  if (pab) pab.innerHTML = pablito('happy');

  let pornit = false;
  const start = () => {
    if (pornit) return;
    pornit = true;
    if (splash) { splash.style.transition = 'opacity .25s'; splash.style.opacity = '0'; setTimeout(() => splash.remove(), 260); }
    boot();
  };

  let autentificat = false;
  try { autentificat = localStorage.getItem('__zonga_authed__') === '1'; } catch (e) {}
  if (!autentificat) { start(); return; }   // fara sesiune nu are ce astepta

  window.addEventListener('zonga:sync', start, { once: true });
  setTimeout(start, 4000);                   // fara retea: jucam cu ce avem local
}
bootCuSincronizare();
</script>
