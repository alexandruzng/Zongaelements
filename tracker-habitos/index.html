<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tracker Hábitos · Zonga</title>
<meta name="description" content="Sigue hasta 9 hábitos al mes en una rueda visual. Marca cada día como cumplido o no hecho y mira tu constancia volverse geometría.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='44' fill='none' stroke='%2314130e' stroke-width='6'/%3E%3Ccircle cx='50' cy='50' r='20' fill='none' stroke='%2314130e' stroke-width='6'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f4efe4;
    --paper-2: #ebe5d6;
    --ink: #14130e;
    --ink-soft: #4b4940;
    --ink-muted: #8a877c;
    --rule: #d6cfbd;
    --rule-soft: #e3dccb;
    --card: #ffffff;
    --done: oklch(0.62 0.13 145);
    --done-soft: oklch(0.62 0.13 145 / 0.18);
    --miss: oklch(0.55 0.17 28);
    --miss-soft: oklch(0.55 0.17 28 / 0.18);
    /* Negro: días en los que un hábito no toca (no cuentan como fallo) */
    --off: #14130e;
    --off-soft: rgba(20, 19, 14, 0.18);
    --highlight: oklch(0.78 0.08 80);
    --accent: oklch(0.45 0.08 50);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); font-family: "Inter Tight", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  body { min-height: 100vh; }
  button { font-family: inherit; cursor: pointer; }
  input, textarea { font-family: inherit; }

  /* Paper background with subtle grain */
  body::before {
    content: "";
    position: fixed; inset: 0;
    background-image:
      radial-gradient(circle at 20% 10%, rgba(180,160,110,0.06), transparent 40%),
      radial-gradient(circle at 80% 90%, rgba(120,100,70,0.05), transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  #root { position: relative; z-index: 1; }

  /* Print: only show the wheel, in B&W, clean */
  @media print {
    body { background: #fff; }
    body::before { display: none; }
    .no-print { display: none !important; }
    .print-only { display: block !important; }
    .wheel-cell-done { fill: #d8d8d8 !important; }
    .wheel-cell-miss { fill: #ffffff !important; stroke-dasharray: 2 2 !important; }
    .wheel-cell-off { fill: #4a4a4a !important; }
    @page { size: landscape; margin: 12mm; }
  }
  .print-only { display: none; }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="/lz-string.min.js"></script>
<script src="/zonga-storage.js"></script>
</head>
<body>
  <div id="root"></div>

  <script src="app.js?v=20260716-1"></script>

  <script src="/zonga-memory.js"></script>
  <script type="module" src="/firebase.js"></script>
  <script type="module" src="/sync.js?v=20260906-kv2"></script>
</body>
</html>
